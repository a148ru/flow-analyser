<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Analyzer - NetFlow Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #eee; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        header h1 { font-size: 28px; color: #e94560; margin-bottom: 5px; }
        .stats { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .stat-card { background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 8px; text-align: center; min-width: 150px; }
        .stat-card h3 { font-size: 14px; color: #888; margin-bottom: 5px; }
        .stat-card p { font-size: 24px; color: #e94560; font-weight: bold; }
        .controls { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        select, button { padding: 10px 15px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
        select { background: rgba(255, 255, 255, 0.1); color: #eee; }
        button { background: #e94560; color: #fff; transition: background 0.3s; }
        button:hover { background: #ff6b6b; }
        button.refresh { background: #00b894; }
        button.refresh:hover { background: #55efc4; }
        .table-container { background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background: rgba(255, 255, 255, 0.05); font-weight: 600; color: #888; font-size: 13px; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .protocol-ICMP { color: #fab1a0; }
        .protocol-TCP { color: #74b9ff; }
        .protocol-UDP { color: #55efc4; }
        .protocol-GRE { color: #fdcb6e; }
        .protocol-Other { color: #a29bfe; }
        .bytes-cell { font-family: Courier New, monospace; }
        .empty-state { padding: 40px; text-align: center; color: #888; }
        .error { color: #ff6b6b; padding: 20px; background: rgba(255, 0, 0, 0.1); border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Flow Analyzer</h1>
            <p>NetFlow Monitor for MikroTik Routers</p>
            <div class="stats">
                <div class="stat-card"><h3>Всего потоков</h3><p id="totalFlows">0</p></div>
                <div class="stat-card"><h3>Потоков за период</h3><p id="periodFlows">0</p></div>
            </div>
        </header>
        <div class="controls">
            <select id="protocolFilter">
                <option value="">Все протоколы</option>
                <option value="ICMP">ICMP</option>
                <option value="TCP">TCP</option>
                <option value="UDP">UDP</option>
                <option value="GRE">GRE</option>
                <option value="ESP">ESP</option>
                <option value="AH">AH</option>
                <option value="OSPF">OSPF</option>
                <option value="SCTP">SCTP</option>
            </select>
            <select id="sortOrder">
                <option value="bytes-desc">По байтам (по убыванию)</option>
                <option value="bytes-asc">По байтам (по возрастанию)</option>
                <option value="packets-desc">По пакетам (по убыванию)</option>
                <option value="packets-asc">По пакетам (по возрастанию)</option>
            </select>
            <button class="refresh" onclick="loadData()">Обновить</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Время начала</th>
                        <th>Источник</th>
                        <th>Порт</th>
                        <th>Назначение</th>
                        <th>Порт</th>
                        <th>Протокол</th>
                        <th>Пакеты</th>
                        <th>Байты</th>
                        <th>Вход</th>
                        <th>Выход</th>
                        <th>AS источник</th>
                        <th>AS назначение</th>
                    </tr>
                </thead>
                <tbody id="flowsTable">
                    <tr><td colspan="12" class="empty-state">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
        <div style="margin-top: 20px; text-align: center; color: #666; font-size: 12px;">
            <p>Потоки от маршрутизаторов MikroTik - NetFlow v5/v9</p>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        let flowsData = [];

        async function loadData() {
            const protocol = document.getElementById('protocolFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;
            let url = `${API_BASE}/api/flows?limit=100`;
            if (protocol) {
                url += `&protocol=${protocol}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                // API returns array directly, not wrapped in {success: true, data: [...]}
                if (Array.isArray(data)) {
                    flowsData = data;
                    renderTable(flowsData, sortOrder);
                    updateStats(flowsData);
                } else {
                    showError('Неожиданный формат ответа');
                }
            } catch (error) {
                showError('Ошибка соединения: ' + error.message);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                // API returns {total_flows: N} directly
                document.getElementById('totalFlows').textContent = data.total_flows || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function renderTable(data, sortOrder) {
            const tbody = document.getElementById('flowsTable');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="empty-state">Нет данных для отображения</td></tr>';
                return;
            }

            let sortedData = [...data];
            if (sortOrder === 'bytes-desc') {
                sortedData.sort((a, b) => b.Flow.Octets - a.Flow.Octets);
            } else if (sortOrder === 'bytes-asc') {
                sortedData.sort((a, b) => a.Flow.Octets - b.Flow.Octets);
            } else if (sortOrder === 'packets-desc') {
                sortedData.sort((a, b) => b.Flow.Packets - a.Flow.Packets);
            } else if (sortOrder === 'packets-asc') {
                sortedData.sort((a, b) => a.Flow.Packets - b.Flow.Packets);
            }

            tbody.innerHTML = sortedData.slice(0, 100).map(entry => `
                <tr>
                    <td>${formatTime(entry.Flow.StartTime)}</td>
                    <td>${entry.Flow.Key.SrcIP}</td>
                    <td>${entry.Flow.Key.SrcPort}</td>
                    <td>${entry.Flow.Key.DstIP}</td>
                    <td>${entry.Flow.Key.DstPort}</td>
                    <td class="protocol-${entry.Flow.Key.ProtocolName}">${entry.Flow.Key.ProtocolName}</td>
                    <td>${entry.Flow.Packets.toLocaleString()}</td>
                    <td class="bytes-cell">${formatBytes(entry.Flow.Octets)}</td>
                    <td>${entry.Flow.InputIfIndex || '-'}</td>
                    <td>${entry.Flow.OutputIfIndex || '-'}</td>
                    <td>${entry.Flow.FirstSrcAs || '-'}</td>
                    <td>${entry.Flow.FirstDstAs || '-'}</td>
                </tr>
            `).join('');
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleString('ru-RU');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function updateStats(data) {
            document.getElementById('periodFlows').textContent = data.length.toLocaleString();
        }

        function showError(message) {
            const tbody = document.getElementById('flowsTable');
            tbody.innerHTML = '<tr><td colspan="12" class="error">' + message + '</td></tr>';
        }

        document.getElementById('protocolFilter').addEventListener('change', loadData);
        document.getElementById('sortOrder').addEventListener('change', loadData);

        loadData();
        loadStats();

        setInterval(() => {
            loadData();
        }, 30000);

        setInterval(() => {
            loadStats();
        }, 60000);
    </script>
</body>
</html>
